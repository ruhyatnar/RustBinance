[package]
name = "botctl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "binance-botctl"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
bot-config = { version = "0.1.0", path = "../bot-config" }
bot-ipc = { version = "0.1.0", path = "../bot-ipc" }
bot-types = { version = "0.1.0", path = "../bot-types" }
clap = { version = "4.6.9", features = ["derive"] }
ed25519-dalek = { version = "3.0.0", features = ["pkcs8", "pem", "zeroize"] }
rand = "0.10.4"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
uuid.workspace = true
zeroize.workspace = true

[dev-dependencies]
tempfile.workspace = true
