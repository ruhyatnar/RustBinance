[package]
name = "bot-exchange"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = []
testnet-it = []

[dependencies]
async-trait = "0.1.92"
base64 = "0.23.1"
bot-types = { workspace = true }
ed25519-dalek = { version = "3.0.0", features = ["pkcs8", "pem", "zeroize"] }
futures-util = "0.3.34"
rand = "0.10.4"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rust_decimal = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tracing = { workspace = true }
url = "2.5.9"
uuid = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }
