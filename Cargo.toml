[workspace]
resolver = "2"
members = [
    "crates/bot-types",
    "crates/bot-config",
    "crates/bot-exchange",
    "crates/bot-marketdata",
    "crates/bot-indicators",
    "crates/bot-strategy",
    "crates/bot-risk",
    "crates/bot-exec",
    "crates/bot-store",
    "crates/bot-ipc",
    "crates/bot-venue",
    "crates/bot-engine",
    "crates/bot-backtest",
    "crates/botd",
    "crates/botctl",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.86"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1.0.104"
rust_decimal = { version = "1.43.0", features = ["serde", "serde-with-str"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
time = { version = "0.3.45", features = ["serde", "serde-well-known", "formatting", "parsing"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }
zeroize = "1.9.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
